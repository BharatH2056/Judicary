<div class="page-container">
    <div class="page-header">
        <div>
            <h2 class="page-title">Courtroom Directory</h2>
            <p class="text-secondary" style="margin-top: 4px; font-size: 14px;">Monitor room availability and manage courtroom resources.</p>
        </div>
        <button class="btn-primary" id="btn-add-courtroom">
            <i class="ti ti-plus"></i> Add Courtroom
        </button>
    </div>

    <!-- Status Legend -->
    <div class="dashboard-panel" style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;">
        <span style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">
            <i class="ti ti-click" style="margin-right: 4px;"></i> Click status badge to cycle room state
        </span>
        <div style="display: flex; gap: 24px; align-items: center; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px;">
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success);"></span> AVAILABLE
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--error);"></span> IN USE
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warning);"></span> MAINTENANCE
            </div>
        </div>
    </div>

    <div id="courtrooms-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;">
        <!-- Populated by JS -->
    </div>
</div>
